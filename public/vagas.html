<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="v_titulo_pagina">Bússola · Vagas Abertas</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/tema.js"></script>
</head>
<body>
  <div class="topbar">
    <div class="inner">
      <div class="brand">
        <img src="img/logo-white.svg" alt="Tony Belleza">
        <div class="sep"></div>
        <div>
          <h1>Bússola</h1>
          <div class="sub" id="sub-vagas">Vagas abertas</div>
        </div>
      </div>
      <div class="actions">
        <a class="btn on-dark small" href="/" data-i18n="inicio">Início</a>
      </div>
    </div>
  </div>

  <div class="container narrow">
    <div id="marca-empresa" style="display:none;align-items:center;justify-content:center;gap:14px;padding-top:32px"></div>
    <div class="hero" style="padding-bottom:24px">
      <h2 id="hero-titulo">Vagas abertas</h2>
      <p data-i18n="v_hero_p">Candidate-se a uma vaga e faça a avaliação completa: testes comportamentais,
        competências e teste de conhecimento.</p>
    </div>
    <div class="card" id="filtro-paises-card" style="display:none;padding:16px 24px">
      <div class="linha-acoes" style="margin:0;align-items:center">
        <span class="desc" style="margin:0" data-i18n="v_pais">País:</span>
        <select id="filtro-pais" style="max-width:260px;margin:0"></select>
      </div>
    </div>
    <div id="lista-vagas">
      <div class="card texto-centro"><p data-i18n="v_carregando">Carregando vagas…</p></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/dados-en.js"></script>
  <script src="js/dados-es.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/render.js"></script>
  <script src="js/i18n-candidato.js"></script>
  <script>
    const gestorPagina = new URLSearchParams(location.search).get("g") || "";
    let empresaPagina = new URLSearchParams(location.search).get("e") || "";
    let todasVagas = [];
    let dadosPagina = null; // resposta de /api/vagas (empresa e página do gestor)
    let mensagemLista = ""; // chave de aviso no lugar da lista (erro, sem link)
    // link de indicação (?ref=codigo): segue para o cadastro e mostra quem indicou
    const refPagina = (new URLSearchParams(location.search).get("ref") || "").replace(/[^a-zA-Z0-9]/g, "");
    const TEXTO_INDICACAO = {
      pt: "{nome} indicou você para trabalhar com a gente. Escolha uma vaga abaixo.",
      en: "{nome} referred you to work with us. Pick a job below.",
      es: "{nome} te recomendó para trabajar con nosotros. Elige una vacante abajo.",
    };
    async function mostrarIndicacao() {
      if (!refPagina || !empresaPagina) return;
      try {
        const r = await fetch("/api/indicacao?e=" + encodeURIComponent(empresaPagina) + "&ref=" + refPagina);
        if (!r.ok) return;
        const d = await r.json();
        const lang = (typeof idiomaCand !== "undefined" && TEXTO_INDICACAO[idiomaCand]) ? idiomaCand : "en";
        const div = document.createElement("div");
        div.className = "card";
        div.style.borderLeft = "4px solid var(--ok, #2E9E6A)";
        div.textContent = TEXTO_INDICACAO[lang].replace("{nome}", d.primeiro_nome || "");
        const lista = document.getElementById("lista-vagas");
        lista.parentNode.insertBefore(div, lista);
      } catch (e) { /* sem indicação */ }
    }

    const TEXTO_VER_VAGA = { pt: "Ver detalhes", en: "View details", es: "Ver detalles" };
    function idiomaPagina() {
      return (typeof idiomaCand !== "undefined" && TEXTO_VER_VAGA[idiomaCand]) ? idiomaCand : "en";
    }
    // marca da empresa (logo e nome) no topo quando a página é de uma empresa
    function desenharMarca() {
      const caixa = document.getElementById("marca-empresa");
      const emp = dadosPagina && dadosPagina.empresa;
      if (!emp) { caixa.style.display = "none"; return; }
      caixa.innerHTML = (emp.logo_url
        ? `<img src="${esc(emp.logo_url)}" alt="${esc(emp.nome)}" style="max-height:64px;max-width:180px;border-radius:8px;background:#fff;padding:6px">`
        : "") + `<span style="font-size:1.1rem;color:var(--text-2)">${esc(emp.nome)}</span>`;
      caixa.style.display = "flex";
    }
    function linkVaga(v) {
      return "/vaga?id=" + v.id + "&lang=" + idiomaPagina() + (refPagina ? "&ref=" + refPagina : "");
    }

    // cabeçalho: nome da empresa ou do gestor e título com o local
    function desenharCabecalho() {
      const sub = document.getElementById("sub-vagas");
      const titulo = document.getElementById("hero-titulo");
      const pagina = dadosPagina && dadosPagina.pagina;
      if (pagina) {
        sub.textContent = t("v_de", { nome: pagina.gestor_nome }) + (pagina.local ? " · " + pagina.local : "");
        titulo.textContent = pagina.local ? t("v_hero_h_local", { local: pagina.local }) : t("v_hero_h");
      } else {
        sub.textContent = dadosPagina && dadosPagina.empresa ? dadosPagina.empresa.nome : t("v_sub");
        titulo.textContent = t("v_hero_h");
      }
    }

    function desenharFiltro() {
      const filtro = document.getElementById("filtro-pais");
      const atual = filtro.value;
      filtro.innerHTML = `<option value="">${esc(t("v_todos_paises"))}</option>` +
        PAISES.map((p) => `<option value="${esc(p)}">${esc(nomePais(p))}</option>`).join("");
      filtro.value = atual;
    }

    function desenharVagas() {
      const el = document.getElementById("lista-vagas");
      if (mensagemLista) {
        el.innerHTML = '<div class="card texto-centro"><p class="desc">' + esc(t(mensagemLista)) + "</p></div>";
        return;
      }
      const pais = document.getElementById("filtro-pais").value;
      const vagas = pais ? todasVagas.filter((v) => v.pais === pais) : todasVagas;
      if (!vagas.length) {
        el.innerHTML = '<div class="card texto-centro"><p class="desc">' +
          esc(pais ? t("v_nenhuma_pais") : t("v_nenhuma")) +
          "</p></div>";
        return;
      }
      el.innerHTML = vagas.map((v) => `
        <div class="vaga-card">
          <div class="info-vaga">
            <h2><a href="${linkVaga(v)}" style="color:inherit;text-decoration:none">${esc(v.titulo)}</a></h2>
            <div class="meta">${esc(v.cargo_nome)}${v.nivel ? " · " + esc(v.nivel) : ""}${v.local ? " · " + esc(v.local) : ""}${v.pais ? " · " + esc(nomePais(v.pais)) : ""}</div>
            ${v.descricao ? `<p class="desc" style="margin:8px 0 0">${esc(v.descricao)}</p>` : ""}
          </div>
          <div class="linha-acoes" style="margin:0">
          <a class="btn secondary" href="${linkVaga(v)}">${esc(TEXTO_VER_VAGA[idiomaPagina()])}</a>
          <a class="btn" href="/candidato?vaga=${v.id}&e=${encodeURIComponent(empresaPagina)}${refPagina ? "&ref=" + refPagina : ""}">${esc(t("v_candidatar"))}</a>
          </div>
        </div>`).join("");
    }

    function redesenharPagina() {
      desenharCabecalho();
      desenharFiltro();
      if (dadosPagina || mensagemLista) desenharVagas();
    }

    montarSeletorIdioma(redesenharPagina);
    desenharCabecalho();
    document.getElementById("filtro-pais").addEventListener("change", desenharVagas);

    fetch("/api/vagas" + (gestorPagina ? "?g=" + encodeURIComponent(gestorPagina)
                               : "?e=" + encodeURIComponent(empresaPagina)))
      .then((r) => r.json()).then((d) => {
      const el = document.getElementById("lista-vagas");
      if (d.erro) {
        // mensagem do servidor (em português), exibida como veio
        el.innerHTML = '<div class="card texto-centro"><p class="desc">' + esc(d.erro) + "</p></div>";
        return;
      }
      if (!d.empresa) {
        mensagemLista = "v_use_link";
        desenharVagas();
        return;
      }
      empresaPagina = d.empresa.slug;
      dadosPagina = d;
      todasVagas = d.vagas;
      desenharMarca();
      desenharCabecalho();
      desenharFiltro();
      if (todasVagas.length) document.getElementById("filtro-paises-card").style.display = "";
      desenharVagas();
      mostrarIndicacao();
    }).catch(() => {
      mensagemLista = "v_erro";
      desenharVagas();
    });
  </script>
</body>
</html>
