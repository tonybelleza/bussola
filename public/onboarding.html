<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Onboarding</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/tema.js"></script>
  <style>
    .ob-idiomas { display: flex; gap: 4px; }
    .ob-idiomas button { padding: 5px 9px; font-size: .74rem; }
    .ob-idiomas button.ativo { background: var(--accent); color: #fff; border-color: var(--accent); }
    .ob-marca { display: flex; align-items: center; gap: 14px; margin-bottom: 4px; }
    .ob-marca img { max-height: 52px; max-width: 200px; border-radius: 8px; background: #fff; padding: 4px; }
    .ob-marca .nome { font-size: 1.15rem; font-weight: 700; }
    .ob-barra { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin: 10px 0 4px; }
    .ob-barra div { height: 100%; background: var(--accent-grad); border-radius: 99px; transition: width .3s; }
    .ob-pct { font-size: .85rem; color: var(--text-2); }
    .ob-lista { display: grid; gap: 8px; margin-top: 12px; }
    .ob-item { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px; border-radius: 14px;
      border: 1px solid var(--line); background: var(--surface); color: var(--text); font: inherit; cursor: pointer; }
    .ob-item .marca-etapa { flex: 0 0 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
      border: 2px solid var(--line); font-size: .8rem; font-weight: 700; color: var(--text-2); }
    .ob-item.feito .marca-etapa { background: var(--ok); border-color: var(--ok); color: #fff; }
    .ob-item .txt { flex: 1; }
    .ob-item .txt small { display: block; color: var(--text-2); font-size: .78rem; margin-top: 2px; }
    .ob-item .seta-ob { color: var(--text-2); }
    .ob-voltar { margin-bottom: 10px; }
    .ob-doc { max-height: 52vh; overflow-y: auto; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px;
      background: var(--surface); line-height: 1.55; font-size: .93rem; -webkit-overflow-scrolling: touch; }
    .ob-doc h2 { font-size: 1.15rem; margin: 6px 0 10px; }
    .ob-doc h3 { font-size: 1rem; margin: 16px 0 6px; }
    .ob-doc p { margin: 0 0 10px; }
    .ob-doc ul { margin: 0 0 10px 18px; padding: 0; }
    .ob-aviso { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: .84rem; margin: 0 0 12px; }
    .ob-rolar { font-size: .8rem; color: var(--warn); margin: 6px 0 0; }
    .ob-assin { position: relative; border: 1px dashed var(--blue-250); border-radius: 12px; background: #fff; touch-action: none; }
    .ob-assin canvas { display: block; width: 100%; height: 170px; border-radius: 12px; touch-action: none; cursor: crosshair; }
    .ob-assin .dica { position: absolute; left: 12px; bottom: 8px; font-size: .75rem; color: #8a97a8; pointer-events: none; }
    .ob-check { display: flex; gap: 10px; align-items: flex-start; margin: 12px 0; font-size: .92rem; }
    .ob-check input { margin-top: 3px; width: 20px; height: 20px; flex: 0 0 20px; }
    .ob-msg { min-height: 1.2em; margin: 8px 0; font-size: .9rem; }
    .ob-acoes { position: sticky; bottom: 0; padding: 12px 0 6px; background: linear-gradient(transparent, var(--bg) 30%); z-index: 2; }
    .ob-resumo { display: grid; gap: 6px; margin: 10px 0; font-size: .92rem; }
    .ob-resumo div { display: grid; grid-template-columns: 120px 1fr; gap: 10px; }
    .ob-resumo .rot { color: var(--muted); }
    .ob-campo-erro input, .ob-campo-erro select, .ob-campo-erro textarea { border-color: var(--err) !important; }
    .ob-campo-erro .erro-campo { display: block; color: var(--err); font-size: .78rem; margin-top: 3px; }
    .erro-campo { display: none; }
    .ob-ajuda { display: block; font-size: .78rem; color: var(--text-2); margin-top: 3px; font-weight: 400; }
    .ob-metodos { display: grid; gap: 8px; margin: 10px 0; }
    .ob-metodo { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--line);
      border-radius: 12px; background: var(--surface); cursor: pointer; }
    .ob-metodo.ativo { border-color: var(--accent); background: rgba(59, 103, 202, .12); }
    .ob-metodo input { margin-top: 4px; }
    .ob-metodo small { display: block; color: var(--text-2); font-size: .8rem; margin-top: 2px; }
    .ob-up { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 8px 0; background: var(--surface); }
    .ob-up .cab { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
    .ob-up .arq { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .85rem; padding: 6px 0;
      border-top: 1px solid var(--line-soft); }
    .ob-up label.btn { cursor: pointer; }
    .ob-up input[type=file] { display: none; }
    .ob-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 520px) {
      .ob-grid2 { grid-template-columns: 1fr; }
      .ob-resumo div { grid-template-columns: 100px 1fr; }
      .container.narrow { padding-left: 12px; padding-right: 12px; }
      .card { padding: 18px 16px; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="inner">
      <div class="brand">
        <img src="img/logo-white.svg" alt="Bússola">
        <div class="sep"></div>
        <div>
          <h1>Bússola</h1>
          <div class="sub" id="topo-sub">Onboarding</div>
        </div>
      </div>
      <div class="actions"><div class="ob-idiomas" id="ob-idiomas"></div></div>
    </div>
  </div>

  <div class="container narrow" id="app">
    <div class="card texto-centro"><p>…</p></div>
  </div>

  <script src="js/onboarding.js"></script>
</body>
</html>
