      brilho: '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M18.5 16.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/>',
      casa: '<path d="M3.5 11L12 4l8.5 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5h4v5"/>',
      cama: '<path d="M3 18V7M3 14h18v4M21 14v-2.5A2.5 2.5 0 0 0 18.5 9H11v5"/><circle cx="7" cy="11" r="2"/>',
      folha: '<path d="M5 19c0-8 5-13 14-14 0 9-5 14-13 14z"/><path d="M5 19l7-7"/>',
      equipe: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14.3A6.5 6.5 0 0 1 21.5 20"/>',
    };
    const ic = (n) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' + (P[n] || "") + "</svg>";
    const ICONES_SETORES = ["brilho", "casa", "cama", "unidades", "folha", "equipe"];
    const ICONES_PASSOS = ["entrada", "voz", "disc", "agenda", "onboarding"];

    // ------------------------------------------------ utilidades
    const $ = (s, el) => (el || document).querySelector(s);
    const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const fmt = (txt, vars) => String(txt || "").replace(/\{(\w+)\}/g, (m, k) => (vars && vars[k] != null ? vars[k] : m));
    const pegar = (dic, caminho) => caminho.split(".").reduce((o, k) => (o ? o[k] : ""), dic);
    const reduzMovimento = () => window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    const LOCALES = { pt: "pt-BR", en: "en-US", es: "es-US" };
    const LANG_HTML = { pt: "pt-BR", en: "en", es: "es" };

    let idioma = idiomaAtual();
    const T = () => TRADUCOES[idioma];

    function num(v) { const n = Number(v); return v !== null && v !== undefined && v !== "" && isFinite(n) ? n : null; }
    function inteiro(n) { return new Intl.NumberFormat(LOCALES[idioma]).format(Math.round(n)); }
    function dinheiro(v, moeda) {
      const n = num(v); if (n === null) return "";
      const frac = Math.abs(n - Math.round(n)) > 1e-9;
      try {
        return new Intl.NumberFormat(LOCALES[idioma], {
          style: "currency", currency: moeda || "USD",
          minimumFractionDigits: frac ? 2 : 0, maximumFractionDigits: frac ? (n < 1 ? 3 : 2) : 0,
        }).format(n);
      } catch (e) { return "$" + n; }
    }

    // ------------------------------------------------ estado dos planos
    let PLANOS = null;          // resposta de /api/planos
    let estadoPlanos = "carregando";
    let ciclo = "mensal";
    let pedidoPlanos = 0;

    function trialDias() { return PLANOS && num(PLANOS.trial_dias) ? num(PLANOS.trial_dias) : 14; }
    function trialMin() { return PLANOS && num(PLANOS.trial_minutos) ? num(PLANOS.trial_minutos) : null; }
    function stripeAtivo() { return !!(PLANOS && PLANOS.stripe_ativo); }

    // preço anual: o servidor manda o total do ano; se vier o valor mensal equivalente, convertemos
    function anualTotal(p) {
      const a = num(p.preco_anual), m = num(p.preco_mensal);
      if (a === null || a <= 0) return null;
      return m && a < m * 2 ? a * 12 : a;
    }
    function economiaAnual(p) {
      const tot = anualTotal(p), m = num(p.preco_mensal);
      if (tot === null || !m) return 0;
      return Math.max(0, m * 12 - tot);
    }
    function maiorEconomiaPct() {
      if (!PLANOS) return 0;
      return PLANOS.planos.reduce((mx, p) => {
        const m = num(p.preco_mensal);
        return m ? Math.max(mx, Math.round(economiaAnual(p) / (m * 12) * 100)) : mx;
      }, 0);
    }
    function linkAssinar(codigo) {
      return "/assinar?plano=" + encodeURIComponent(codigo) + "&ciclo=" + ciclo;
    }

    async function carregarPlanos() {
      const meu = ++pedidoPlanos;
      let dados = null;
      try {
        const ctrl = "AbortController" in window ? new AbortController() : null;
        const timer = setTimeout(() => ctrl && ctrl.abort(), 8000);
        const r = await fetch("/api/planos?idioma=" + idioma, {
          headers: { Accept: "application/json", "X-Idioma": idioma },
          signal: ctrl ? ctrl.signal : undefined,
        });
        clearTimeout(timer);
        if (!r.ok) throw new Error("http " + r.status);
        dados = await r.json();
        if (!dados || !Array.isArray(dados.planos)) throw new Error("formato");
        dados.planos = dados.planos.filter((p) => p && p.codigo && p.nome);
        if (!dados.planos.length) throw new Error("vazio");
        dados.addons = dados.addons || {};
      } catch (e) {
        dados = null;
      }
      if (meu !== pedidoPlanos) return;
      if (dados) { PLANOS = dados; estadoPlanos = "ok"; }
      else if (!PLANOS) estadoPlanos = "erro";
      desenharDinamicos();
      atualizarJsonLd();
    }

    // ------------------------------------------------ preços
    function desenharPrecos() {
      const t = T();
      const caixa = $("#planos"), linhaCiclo = $("#ciclo-linha");
      $$("[data-ciclo]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.ciclo === ciclo)));
      if (estadoPlanos !== "ok") {
        linhaCiclo.hidden = true;
        caixa.className = "";
        caixa.innerHTML = estadoPlanos === "carregando"
          ? '<p class="lp-aviso">' + esc(t.pr_carregando) + "</p>"
          : '<div class="lp-aviso lp-glass"><p>' + esc(t.pr_erro) + '</p><a class="btn" href="/assinar">' + esc(t.pr_cta) + "</a></div>";
        $("#addons").innerHTML = "";
        return;
      }
      const moeda = PLANOS.moeda || "USD";
      const temAnual = PLANOS.planos.some((p) => anualTotal(p) !== null);
      linhaCiclo.hidden = !temAnual;
      if (!temAnual) ciclo = "mensal";
      const pct = maiorEconomiaPct();
      const badge = $("#economia-badge");
      badge.hidden = !pct;
      badge.textContent = pct ? fmt(t.pr_economize, { p: pct }) : "";

      caixa.className = "lp-planos";
      caixa.innerHTML = PLANOS.planos.map((p) => {
        const m = num(p.preco_mensal), tot = anualTotal(p);
        const anual = ciclo === "anual" && tot !== null;
        const preco = anual ? tot / 12 : m;
        let nota = "";
        if (anual) {
          nota = esc(fmt(t.pr_cobrado_anual, { v: dinheiro(tot, moeda) }));
          const eco = economiaAnual(p);
          if (eco > 0) nota += '<span class="eco">' + esc(fmt(t.pr_economia, { v: dinheiro(eco, moeda) })) + "</span>";
        }
        // o servidor já manda a lista de recursos traduzida; sem ela, montamos pelos campos
        const recursos = (Array.isArray(p.recursos) ? p.recursos : []).filter(Boolean).map(String);
        const itens = [];
        if (recursos.length) {
          recursos.forEach((r, i) => itens.push([i === 0 && num(p.minutos_voz) > 0 ? "forte" : "", r]));
        } else {
          if (num(p.minutos_voz) > 0) itens.push(["forte", fmt(t.pr_minutos, { n: inteiro(p.minutos_voz) })]);
          if ("numero_exclusivo" in p && num(p.minutos_voz) > 0) itens.push(["", p.numero_exclusivo ? t.pr_numero_sim : t.pr_numero_nao]);
          if (num(p.sms_mes)) itens.push(["", fmt(t.pr_sms, { n: inteiro(p.sms_mes) })]);
          if ("gestores_max" in p) itens.push(["", num(p.gestores_max) > 0 ? fmt(t.pr_gestores, { n: inteiro(p.gestores_max) }) : t.pr_gestores_ilim]);
        }
        return '<article class="lp-plano lp-glass' + (p.destaque ? " destaque" : "") + '">' +
          (p.destaque ? '<span class="lp-plano-tag">' + esc(t.pr_destaque) + "</span>" : "") +
          "<h3>" + esc(p.nome) + "</h3>" +
          '<p class="desc">' + esc(p.descricao || "") + "</p>" +
          '<div class="lp-preco"><b>' + esc(dinheiro(preco, moeda)) + "</b><span>" + esc(t.pr_mes) + "</span></div>" +
          '<p class="lp-preco-nota">' + nota + "</p>" +
          "<ul>" + itens.map(([cls, txt]) => '<li class="' + cls + '">' + ic("check") + "<span>" + esc(txt) + "</span></li>").join("") + "</ul>" +
          '<a class="btn' + (p.destaque ? "" : " secondary") + ' block" href="' + esc(linkAssinar(p.codigo)) + '">' + esc(t.pr_cta) + "</a>" +
          "</article>";
      }).join("");

      const a = PLANOS.addons || {};
      const add = [
        [num(a.minuto_extra), t.pr_addon_min, t.pr_por_min],
        [num(a.numero_extra), t.pr_addon_num, t.pr_por_mes],
        [num(a.sms_extra), t.pr_addon_sms, t.pr_por_sms],
      ].filter((x) => x[0] !== null);
      $("#addons").innerHTML = add.length
        ? '<div class="lp-addons lp-glass"><h3>' + esc(t.pr_addons) + "</h3>" +
          add.map(([v, nome, un]) => "<div><span>" + esc(nome) + "</span><b>" + esc(dinheiro(v, moeda)) + "</b><span>" + esc(un) + "</span></div>").join("") + "</div>"
        : "";
    }

    function textoTrial() {
      const t = T();
      const min = trialMin();
      let s = min ? fmt(t.pr_trial, { dias: trialDias(), min: inteiro(min) }) : fmt(t.pr_trial_sem_min, { dias: trialDias() });
      if (!stripeAtivo()) s += " " + t.pr_cartao;
      return s;
    }

    function desenharNotas() {
      const t = T();
      const notas = [fmt(t.nota_trial, { dias: trialDias() }), stripeAtivo() ? t.nota_cancelar : t.nota_cartao, t.nota_idiomas];
      $$("[data-notas]").forEach((ul) => {
        ul.innerHTML = notas.map((n) => "<li>" + ic("check") + "<span>" + esc(n) + "</span></li>").join("");
      });
      $("#trial-nota").textContent = estadoPlanos === "ok" ? textoTrial() : "";
    }

    // ------------------------------------------------ calculadora
    const MIN_TRIAGEM = 6;      // minutos de uma triagem concluída
    const MIN_SEM_RESPOSTA = 1; // minutos somados de tentativas e caixa postal de quem não atende

    function desenharCalc() {
      const t = T();
      const cand = Number($("#calc-cand").value), taxa = Number($("#calc-taxa").value) / 100;
      $("#calc-cand-v").textContent = inteiro(cand);
      $("#calc-taxa-v").textContent = Math.round(taxa * 100) + "%";
      const est = Math.round(cand * taxa * MIN_TRIAGEM + cand * (1 - taxa) * MIN_SEM_RESPOSTA);
      const media = (est / cand).toLocaleString(LOCALES[idioma], { maximumFractionDigits: 1 });
      $("#calc-min").textContent = inteiro(est);
      $("#calc-media").textContent = fmt(t.calc_media, { n: media });

      const caixa = $("#calc-plano");
      if (estadoPlanos !== "ok") {
        caixa.innerHTML = estadoPlanos === "erro" ? "<p>" + esc(t.calc_sem_planos) + "</p>" : "";
        return;
      }
      const comMin = PLANOS.planos.filter((p) => num(p.minutos_voz) !== null).sort((a, b) => num(a.minutos_voz) - num(b.minutos_voz));
      if (!comMin.length) { caixa.innerHTML = ""; return; }
      let rec = comMin.find((p) => num(p.minutos_voz) >= est);
      let extra = "";
      if (!rec) {
        rec = comMin[comMin.length - 1];
        const falta = est - num(rec.minutos_voz);
        const precoMin = num((PLANOS.addons || {}).minuto_extra);
        extra = fmt(t.calc_excede, { plano: rec.nome, n: inteiro(falta), v: precoMin !== null ? dinheiro(falta * precoMin, PLANOS.moeda) : "?" });
      }
      const m = num(rec.preco_mensal), tot = anualTotal(rec);
      const preco = ciclo === "anual" && tot !== null ? tot / 12 : m;
      caixa.innerHTML = '<span class="rot">' + esc(t.calc_recomendado) + "</span>" +
        "<b>" + esc(rec.nome) + "</b>" +
        "<p>" + esc(fmt(t.pr_minutos, { n: inteiro(rec.minutos_voz) })) + (preco !== null ? " · " + esc(dinheiro(preco, PLANOS.moeda)) + esc(t.pr_mes) : "") + "</p>" +
        (extra ? "<p>" + esc(extra) + "</p>" : "") +
        '<a class="btn block" href="' + esc(linkAssinar(rec.codigo)) + '">' + esc(fmt(t.calc_escolher, { plano: rec.nome })) + "</a>";
    }

    // ------------------------------------------------ FAQ
    function desenharFaq() {
      const t = T();
      const min = trialMin();
      const minTxt = min ? fmt(t.faq_trial_min, { min: inteiro(min) }) : "";
      const trial = fmt(stripeAtivo() ? t.faq_trial_com_cartao : t.faq_trial_sem_cartao, { dias: trialDias(), min_txt: minTxt });
      const abertos = $$("#faq-lista details").map((d) => d.open);
      $("#faq-lista").innerHTML = t.faq.map(([q, a], i) =>
        "<details" + (abertos[i] ? " open" : "") + "><summary>" + esc(q) + ic("mais") + "</summary><p>" + esc(a === "{trial}" ? trial : a) + "</p></details>").join("");
    }

    // ------------------------------------------------ JSON-LD com os planos
    function atualizarJsonLd() {
      if (!PLANOS) return;
      const el = $("#jsonld");
      let base;
      try { base = JSON.parse(el.textContent); } catch (e) { return; }
      const moeda = PLANOS.moeda || "USD";
      const offers = PLANOS.planos.filter((p) => num(p.preco_mensal) !== null).map((p) => ({
        "@type": "Offer", name: String(p.nome), price: String(num(p.preco_mensal)), priceCurrency: moeda,
        url: location.origin + "/assinar?plano=" + encodeURIComponent(p.codigo) + "&ciclo=mensal",
        priceSpecification: { "@type": "UnitPriceSpecification", price: num(p.preco_mensal), priceCurrency: moeda, unitCode: "MON" },
      }));
      if (offers.length) base.offers = offers;
      el.textContent = JSON.stringify(base);
    }

    // ------------------------------------------------ conversa (herói e Francisca)
    function msgHtml(linha, t) {
      const [quem, lng, txt] = linha;
      if (quem === "t") return '<div class="lp-troca">' + esc(fmt(t.mock_troca, { idioma: t.idioma_nome[lng] })) + "</div>";
      const nome = quem === "f" ? t.francisca : t.voce;
      return '<div class="lp-msg ' + quem + '" lang="' + LANG_HTML[lng] + '"><small>' + esc(nome) + "<em>" + lng.toUpperCase() + "</em></small>" + esc(txt) + "</div>";
    }

    let timerConversa = null, timerRelogio = null, segundos = 0;
    function pararConversa() { clearTimeout(timerConversa); clearInterval(timerRelogio); }
    function rodarConversa() {
      pararConversa();
      const t = T(), conv = $("#call-conv"), res = $("#call-resultado"), chip = $("#call-idioma");
      const linhas = t.conversa;
      $("#call-mock").setAttribute("aria-label", t.mock_exemplo + ": " + linhas.filter((l) => l[0] !== "t").map((l) => l[2]).join(" "));
      res.classList.remove("on");
      chip.classList.remove("troca");
      chip.textContent = linhas[0][1].toUpperCase();
      if (reduzMovimento()) {
        conv.innerHTML = linhas.map((l) => msgHtml(l, t)).join("");
        chip.textContent = linhas[linhas.length - 1][1].toUpperCase();
        $("#call-tempo").textContent = "02:14";
        res.classList.add("on");
        return;
      }
      conv.innerHTML = "";
      segundos = 0;
      $("#call-tempo").textContent = "00:00";
      timerRelogio = setInterval(() => {
        segundos++;
        $("#call-tempo").textContent = String(Math.floor(segundos / 60)).padStart(2, "0") + ":" + String(segundos % 60).padStart(2, "0");
      }, 1000);
      let i = 0;
      const proximo = () => {
        if (i >= linhas.length) {
          clearInterval(timerRelogio);
          res.classList.add("on");
          timerConversa = setTimeout(rodarConversa, 7000);
          return;
        }
        const l = linhas[i++];
        if (l[0] === "t") {
          conv.insertAdjacentHTML("beforeend", msgHtml(l, t));
          chip.textContent = l[1].toUpperCase();
          chip.classList.add("troca");
          timerConversa = setTimeout(proximo, 700);
        } else if (l[0] === "f") {
          conv.insertAdjacentHTML("beforeend", '<div class="lp-digitando" title="' + esc(t.mock_digitando) + '"><span></span><span></span><span></span></div>');
          timerConversa = setTimeout(() => {
            const d = $(".lp-digitando", conv); if (d) d.remove();
            conv.insertAdjacentHTML("beforeend", msgHtml(l, t));
            timerConversa = setTimeout(proximo, 1500);
          }, 900);
        } else {
          conv.insertAdjacentHTML("beforeend", msgHtml(l, t));
          timerConversa = setTimeout(proximo, 1300);
        }
      };
      timerConversa = setTimeout(proximo, 600);
    }

    // ------------------------------------------------ desenho geral
    function desenharEstaticos() {
      const t = T();
      document.documentElement.lang = LANG_HTML[idioma];
      document.title = t.meta_title;
      const md = $('meta[name="description"]'); if (md) md.setAttribute("content", t.meta_desc);

      $$("[data-i18n]").forEach((el) => { el.textContent = pegar(t, el.dataset.i18n); });
      $$("[data-i18n-html]").forEach((el) => { el.innerHTML = pegar(t, el.dataset.i18nHtml); });
      $$("[data-ic]").forEach((el) => { el.innerHTML = ic(el.dataset.ic); el.style.display = "inline-flex"; });

      $$(".lp-lang").forEach((g) => {
        g.setAttribute("aria-label", t.idioma_rot);
        g.innerHTML = IDIOMAS_LANDING.map((c) =>
          '<button type="button" data-lang="' + c + '" lang="' + LANG_HTML[c] + '" aria-pressed="' + (c === idioma) + '" title="' +
          { pt: "Português", en: "English", es: "Español" }[c] + '">' + c.toUpperCase() + "</button>").join("");
      });
      const menu = $("#btn-menu");
      const aberto = menu.getAttribute("aria-expanded") === "true";
      menu.innerHTML = ic(aberto ? "fechar" : "menu");
      menu.setAttribute("aria-label", t.menu);
      const bt = $(".btn-tema"); if (bt) bt.setAttribute("aria-label", t.tema);

      $("#setores").innerHTML = t.setores.map((s, i) => "<span>" + ic(ICONES_SETORES[i]) + esc(s) + "</span>").join("");
      $("#fatos-produto").innerHTML = t.fatos_produto.map(([n, s]) => '<div class="lp-glass"><b>' + esc(n) + "</b><span>" + esc(s) + "</span></div>").join("");
      $("#passos").innerHTML = t.passos.map(([h, p], i) =>
        '<li class="lp-passo lp-glass"><div class="topo"><span class="lp-ico">' + ic(ICONES_PASSOS[i]) + '</span><span class="num">0' + (i + 1) + "</span></div><h3>" + esc(h) + "</h3><p>" + esc(p) + "</p></li>").join("");
      $("#recursos-grid").innerHTML = t.recursos.map(([icone, h, p, novo]) =>
        '<article class="lp-card lp-glass"><span class="lp-ico">' + ic(icone) + "</span><h3>" + esc(h) + (novo ? '<span class="lp-novo">' + esc(t.novo) + "</span>" : "") + "</h3><p>" + esc(p) + "</p></article>").join("");
      $("#fr-lista").innerHTML = t.fr_lista.map((x) => "<li>" + ic("check") + "<span>" + esc(x) + "</span></li>").join("");
      $("#fr-conv").innerHTML = t.conversa.map((l) => msgHtml(l, t)).join("");
      const pares = [...new Set(t.conversa.map((l) => l[1]))];
      $("#fr-par").textContent = pares.map((x) => x.toUpperCase()).join(" / ");
      $("#fr-fatos").innerHTML = t.fatos.map(([k, v]) => "<div><dt>" + esc(k) + "</dt><dd>" + esc(v) + "</dd></div>").join("");
      $("#ob-lista").innerHTML = t.ob_lista.map((x) => "<li>" + ic("check") + "<span>" + esc(x) + "</span></li>").join("");
      const feitos = 3;
      $("#ob-prog").textContent = fmt(t.ob_mock_prog, { n: feitos });
      $("#ob-itens").innerHTML = t.ob_itens.map((x, i) => {
        const ok = i < feitos;
        return '<li><span class="bola' + (ok ? " ok" : "") + '">' + (ok ? ic("check") : "") + "</span>" + esc(x) +
          '<span class="st ' + (ok ? "ok" : "pend") + '">' + esc(ok ? t.ob_feito : t.ob_pendente) + "</span></li>";
      }).join("");
      $("#seg-grid").innerHTML = t.seg_itens.map(([icone, h, p]) =>
        '<article class="lp-card lp-glass"><span class="lp-ico">' + ic(icone) + "</span><h3>" + esc(h) + "</h3><p>" + esc(p) + "</p></article>").join("");
      $("#pilares").innerHTML = t.autor_pilares.map((p) => "<span>" + esc(p) + "</span>").join("");
      $("#rod-copy").textContent = fmt(t.rod_copy, { ano: new Date().getFullYear() });
    }

    function desenharDinamicos() {
      desenharPrecos();
      desenharNotas();
      desenharCalc();
      desenharFaq();
    }

    function trocarIdioma(cod) {
      if (!IDIOMAS_LANDING.includes(cod) || cod === idioma) return;
      idioma = cod;
      try { localStorage.setItem("idioma", cod); } catch (e) { /* armazenamento bloqueado */ }
      desenharEstaticos();
      desenharDinamicos();
      rodarConversa();
      carregarPlanos(); // nomes e descrições dos planos vêm traduzidos do servidor
    }

    // ------------------------------------------------ eventos
    function fecharMenu() {
      const btn = $("#btn-menu");
      btn.setAttribute("aria-expanded", "false");
      btn.innerHTML = ic("menu");
      $("#drawer").hidden = true;
    }
    document.addEventListener("click", (ev) => {
      const b = ev.target.closest("[data-lang]");
      if (b) { trocarIdioma(b.dataset.lang); return; }
      const c = ev.target.closest("[data-ciclo]");
      if (c) { ciclo = c.dataset.ciclo; desenharPrecos(); desenharCalc(); return; }
      if (ev.target.closest("#drawer a")) fecharMenu();
    });
    $("#btn-menu").addEventListener("click", () => {
      const btn = $("#btn-menu");
      const abrir = btn.getAttribute("aria-expanded") !== "true";
      btn.setAttribute("aria-expanded", String(abrir));
      btn.innerHTML = ic(abrir ? "fechar" : "menu");
      $("#drawer").hidden = !abrir;
    });
    document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") fecharMenu(); });
    $("#calc-cand").addEventListener("input", desenharCalc);
    $("#calc-taxa").addEventListener("input", desenharCalc);
    document.addEventListener("visibilitychange", () => { if (document.hidden) pararConversa(); else rodarConversa(); });
    document.addEventListener("DOMContentLoaded", () => {
      const bt = $(".btn-tema"); if (bt) bt.setAttribute("aria-label", T().tema);
    });

    // ------------------------------------------------ início
    desenharEstaticos();
    desenharDinamicos();
    rodarConversa();
    carregarPlanos();

    // revelação suave ao rolar (desligada com prefers-reduced-motion)
    if (!reduzMovimento() && "IntersectionObserver" in window) {
      const obs = new IntersectionObserver((entradas) => entradas.forEach((e) => {
        if (e.isIntersecting) { e.target.classList.add("on"); obs.unobserve(e.target); }
      }), { threshold: 0.08, rootMargin: "0px 0px -40px 0px" });
      $$(".rv").forEach((el) => obs.observe(el));
      const barra = $("#ob-barra");
      const obsBarra = new IntersectionObserver((ent) => ent.forEach((e) => {
        if (e.isIntersecting) { barra.style.width = "50%"; obsBarra.disconnect(); }
      }), { threshold: 0.4 });
      obsBarra.observe(barra);
    } else {
      $$(".rv").forEach((el) => el.classList.add("on"));
      $("#ob-barra").style.width = "50%";
    }
  })();
  </script>
</body>
</html>
